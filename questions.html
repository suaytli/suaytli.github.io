      { text: `What's something you say now that you picked up from a specific friend group or workplace?`, theme: `Culture, Language & Communication` },
      { text: `What's a story or reference that only makes sense to people who share your background?`, theme: `Culture, Language & Communication` },
      { text: `What's something that's considered rude in one context you're familiar with and completely normal in another?`, theme: `Culture, Language & Communication` },
      { text: `What's a way you soften or sharpen how you speak depending on who you're talking to?`, theme: `Culture, Language & Communication` },
      { text: `What's a name, place, or term you mispronounced for years before finding out the correct way?`, theme: `Culture, Language & Communication` },
      { text: `What's something about how your family communicates that you've had to explain to a partner or friend?`, theme: `Culture, Language & Communication` },
      { text: `What's a slang term or expression you use that you can trace to a specific time in your life?`, theme: `Culture, Language & Communication` },
      { text: `What's something lost in translation, literally or figuratively, that you wish wasn't?`, theme: `Culture, Language & Communication` },
      { text: `What's a way you express affection that isn't verbal?`, theme: `Culture, Language & Communication` },
      { text: `What's something about small talk that you find genuinely useful, despite its reputation?`, theme: `Culture, Language & Communication` },
      { text: `What's a topic you find hard to discuss in your first language but easier in a second, or vice versa?`, theme: `Culture, Language & Communication` },
      { text: `What's a communication habit you've had to unlearn to be better understood?`, theme: `Culture, Language & Communication` },
      { text: `What's something that used to scare you that you did anyway, and how did it go?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a risk you didn't take that you still think about?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something uncomfortable you've learned to sit with instead of avoiding?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a fear you have that you know is irrational but can't quite shake?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something you avoided for a long time that turned out to be far less bad than expected?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a situation where being uncomfortable actually taught you something useful?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something you're still working up the courage to do?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a time you pushed through discomfort and it paid off in a way you didn't expect?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something you're cautious about that most people around you aren't?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a fear from childhood that you've completely outgrown?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something you do specifically because it scares you a little?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a worst-case scenario you've imagined that, in hindsight, was way overblown?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something you had to fail at publicly before you got comfortable with it?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a type of vulnerability you find easier now than you used to?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something you avoid not out of fear, but because you've just never had a reason to try it?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a risk you're glad someone talked you into taking?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something you're more careful about now because of a specific experience?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a discomfort you've chosen on purpose, like travel, a hard conversation, or a new skill?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's something you thought would be a big deal that turned out to be a non-event?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a fear you have now that you think you'll look back on differently in ten years?`, theme: `Fear, Risk & Discomfort` },
      { text: `What's a choice you made where you can clearly remember weighing the alternative?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's something you gave up that you don't regret, even though it was hard at the time?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a decision you made for practical reasons that turned out to matter emotionally too?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's something you chose not because you wanted it most, but because it made the most sense at the time?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a trade-off in your life you're still actively making, not one you made once and moved on from?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a path you didn't take that you check in on occasionally, out of curiosity rather than regret?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a decision you made quickly that you'd make slowly if you had to do it again?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's something you chose to prioritize that most people around you don't prioritize the same way?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a compromise you made that you're proud of, rather than one you resent?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a decision where you picked the harder option on purpose?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's something you almost didn't do because it seemed impractical, and are glad you did anyway?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a choice you made for someone else's benefit that ended up benefiting you too?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's something you turned down that you've never regretted, even briefly?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a decision you made that surprised the people who know you best?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's something you chose based on a gut feeling that you couldn't have justified logically at the time?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a version of your life you can picture clearly if one specific choice had gone differently?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a decision that took you much longer to make than it probably should have?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's something you'd choose differently now, not out of regret, but just because you're different?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's a choice you made that other people questioned but you never doubted?`, theme: `Choices, Trade-offs & Alternate Paths` },
      { text: `What's something you're currently deciding between, and what's actually making it hard?`, theme: `Choices, Trade-offs & Alternate Paths` },
    ];

    const icebreakerThemes = [
      `Invisible Rules & Inherited Habits`,
      `Turning Points & Accidents`,
      `Changing Your Mind`,
      `Skills, Knowledge & Obsolescence`,
      `Places & How They Change You`,
      `Relationships & People Who Shaped You`,
      `Work & How People Actually Spend Their Time`,
      `Objects, Money & Material Life`,
      `Time, Memory & Change`,
      `Systems, Norms & Quiet Disagreements`,
      `Curiosity, Learning & What Sticks`,
      `Self-Perception & Contradiction`,
      `Culture, Language & Communication`,
      `Fear, Risk & Discomfort`,
      `Choices, Trade-offs & Alternate Paths`,
    ];

    // --- STATE ---
    let activeSet = '321';       // '321' or 'ice'
    let activeTheme = 'all';     // used only when activeSet === 'ice'

    // --- DOM REFS ---
    const display = document.getElementById('q-display');
    const numInput = document.getElementById('q-number');
    const pullBtn = document.getElementById('q-pull');
    const randomBtn = document.getElementById('q-random');
    const pageTitle = document.getElementById('page-title');
    const setIntro = document.getElementById('set-intro');
    const set321Btn = document.getElementById('set-321');
    const setIceBtn = document.getElementById('set-ice');
    const themeFilterBar = document.getElementById('theme-filter-bar');
    const themeFilterCount = document.getElementById('theme-filter-count');

    const intros = {
      '321': "This is an archive of 321 questions my friends and I put together to bypass the usual small talk. Pull a number or let the machine decide whenever the conversation hits a dead end.",
      'ice': "This is a brand new set of questions to test the JS. These questions are browsed and generated after a specific hoca of mine told me that 321 questions are too cringe..."
    };

    // Build theme filter buttons dynamically from the icebreaker set
    const themeSet = [...new Set(icebreakers.map(q => q.theme))];
    themeSet.forEach(theme => {
      const btn = document.createElement('button');
      btn.className = 'tag-filter-btn';
      btn.dataset.theme = theme;
      btn.textContent = theme;
      btn.addEventListener('click', () => {
        activeTheme = theme;
        document.querySelectorAll('#theme-filter-bar .tag-filter-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.theme === theme);
        });
        updateThemeCount();
        resetDisplay();
      });
      themeFilterBar.appendChild(btn);
    });

    document.querySelector('#theme-filter-bar [data-theme="all"]').addEventListener('click', () => {
      activeTheme = 'all';
      document.querySelectorAll('#theme-filter-bar .tag-filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === 'all');
      });
      updateThemeCount();
      resetDisplay();
    });

    function currentPool() {
      if (activeSet === '321') return questions.map((text, i) => ({ text, num: i + 1 }));
      const filtered = activeTheme === 'all' ? icebreakers : icebreakers.filter(q => q.theme === activeTheme);
      return filtered.map((q, i) => ({ text: q.text, num: i + 1 }));
    }

    function updateThemeCount() {
      const pool = currentPool();
      themeFilterCount.textContent = activeTheme === 'all'
        ? `${icebreakers.length} questions`
        : `${pool.length} / ${icebreakers.length} questions`;
    }

    function resetDisplay() {
      numInput.value = '';
      const pool = currentPool();
      numInput.max = pool.length;
      numInput.placeholder = `# 1-${pool.length}`;
      display.innerHTML = `<span class="q-placeholder">Awaiting input...</span>`;
    }

    function switchSet(set) {
      activeSet = set;
      activeTheme = 'all';

      pageTitle.textContent = set === '321' ? '321 Questions' : '300 Icebreakers';
      setIntro.textContent = intros[set];
      set321Btn.classList.toggle('active', set === '321');
      setIceBtn.classList.toggle('active', set === 'ice');
      themeFilterBar.style.display = set === 'ice' ? 'flex' : 'none';

      if (set === 'ice') {
        document.querySelectorAll('#theme-filter-bar .tag-filter-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.theme === 'all');
        });
        updateThemeCount();
      }

      resetDisplay();
    }

    set321Btn.addEventListener('click', () => switchSet('321'));
    setIceBtn.addEventListener('click', () => switchSet('ice'));

    pullBtn.addEventListener('click', () => {
      const pool = currentPool();
      const index = parseInt(numInput.value) - 1;

      if (index >= 0 && index < pool.length) {
        display.innerHTML = `<span class="q-number-tag">Question #${pool[index].num}</span><br><br>${pool[index].text}`;
      } else {
        display.innerHTML = `<span class="q-placeholder">Error: Please enter a valid number between 1 and ${pool.length}.</span>`;
      }
    });

    randomBtn.addEventListener('click', () => {
      const pool = currentPool();
      const randomIndex = Math.floor(Math.random() * pool.length);

      numInput.value = pool[randomIndex].num;

      display.innerHTML = `<span class="q-number-tag">Question #${pool[randomIndex].num}</span><br><br>${pool[randomIndex].text}`;
    });

    // init
    resetDisplay();
  </script>
